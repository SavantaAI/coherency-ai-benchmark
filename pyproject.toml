[project]
name = "coherency-benchmark"
version = "0.0.0"
description = "User-grounded LLM coherency benchmark"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs Docker and builds images; runs only when selected with -m integration",
    "slow: runs the complete scripted suite twice through export, scoring, and report",
]
